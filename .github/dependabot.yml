# Dependabot refreshes the actions in .github/workflows and the ubuntu:26.04
# digest in the Dockerfile. It never moves the base to another release. A new
# release and the apt snapshot are manual edits, see README.md. The prefixes
# are there because the gate lints every commit as a Conventional Commit.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docker)
    # Digest refreshes only. To Dependabot 26.10 is a minor bump and 27.04 a
    # major one, so ignoring both keeps the tag at 26.04.
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
